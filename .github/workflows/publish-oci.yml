# Parallel build + atomic batch publish of gRPC CL wrapper as an OCI package
# with platform-specific native library overlays.
name: Publish OCI Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (default: from tag)"
        required: false
        default: ""
      registry:
        description: "OCI registry (default: ghcr.io)"
        required: false
        default: ""

env:
  DEFAULT_REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            lib: grpc.so
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            lib: grpc.so
          - os: darwin
            arch: arm64
            runner: macos-latest
            lib: grpc.dylib

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew (Linux)
        if: matrix.os == 'linux'
        uses: Homebrew/actions/setup-homebrew@master

      - name: Add Homebrew to environment (Linux)
        if: matrix.os == 'linux'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          BREW_PREFIX="/home/linuxbrew/.linuxbrew"
          {
            echo "HOMEBREW_PREFIX=${BREW_PREFIX}"
            echo "HOMEBREW_CELLAR=${BREW_PREFIX}/Cellar"
            echo "HOMEBREW_REPOSITORY=${BREW_PREFIX}/Homebrew"
            echo "PKG_CONFIG_PATH=${BREW_PREFIX}/lib/pkgconfig:${BREW_PREFIX}/share/pkgconfig"
            echo "CPATH=${BREW_PREFIX}/include"
            echo "LIBRARY_PATH=${BREW_PREFIX}/lib"
            echo "LD_LIBRARY_PATH=${BREW_PREFIX}/lib"
          } >> "$GITHUB_ENV"

      - name: Install gRPC dev libraries (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config patchelf
          brew install grpc

      - name: Install gRPC dev libraries (macOS)
        if: matrix.os == 'darwin'
        run: brew install grpc pkg-config

      - name: Build native wrapper
        run: make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Bundle gRPC C++ runtime (Homebrew-linked .so/.dylib)
        run: |
          mkdir -p native-bundle
          chmod +x scripts/bundle-grpc-native-deps.sh
          ./scripts/bundle-grpc-native-deps.sh "${{ matrix.lib }}" native-bundle

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: native-bundle/

  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: ver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$V" ]; then
            V="$(tr -d '[:space:]"' < version.sexp)"
          fi
          [ -n "$V" ] || { echo "could not resolve package version" >&2; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

  publish:
    needs: [build, resolve-version]
    permissions:
      contents: read
      packages: write
    uses: egao1980/cl-repository/.github/workflows/publish-native-package.yml@main
    with:
      package-name: grpc
      version: ${{ needs.resolve-version.outputs.version }}
      registry: ${{ inputs.registry || 'ghcr.io' }}
      source-paths: |
        grpc.asd
        version.sexp
        grpc.lisp
        client.lisp
        server.lisp
        shared.lisp
        libraries.lisp
        protobuf-integration.lisp
        client.cc
        server.cc
        client_auth.cc
        Makefile
        README.md
        LICENSE
        CONTRIBUTING.md
        tests
        examples
    secrets: inherit
